name: Build Armbian

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Armbian Image
    runs-on: ubuntu-24.04-arm
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Force Kernel version to 6.18
        run: |
          sed -i 's/KERNEL_MAJOR_MINOR=".*"/KERNEL_MAJOR_MINOR="6.18"/g' config/sources/families/sm8250.conf
          sed -i "s/KERNELBRANCH='.*'/KERNELBRANCH='tag:v6.18.62'/g" config/sources/families/sm8250.conf
          cat config/sources/families/sm8250.conf

      - name: Inject mkbootimg fix via Armbian Extension
        run: |
          mkdir -p userpatches/extensions
          cat << 'EOF' > userpatches/extensions/mkbootimg.sh
          function install_mkbootimg_tool() {
              if [ ! -d /usr/bin/gki ] || [ ! -f /usr/bin/mkbootimg ]; then
                  echo "[Extension] Installing Android mkbootimg and GKI tools..."
                  git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg /tmp/mkbootimg
                  cp /tmp/mkbootimg/mkbootimg.py /usr/bin/mkbootimg
                  chmod +x /usr/bin/mkbootimg
                  cp -r /tmp/mkbootimg/gki /usr/bin/
                  rm -rf /tmp/mkbootimg
              fi
          }

          function post_prepare_host__install_mkbootimg() {
              install_mkbootimg_tool
          }

          function pre_image_create__install_mkbootimg() {
              install_mkbootimg_tool
          }
          EOF

      - name: Run Armbian Build Script
        run: |
          ./compile.sh \
            BOARD=oneplus-kebab \
            BRANCH=current \
            RELEASE=noble \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=no \
            KERNEL_CONFIGURE=no \
            INSTALL_HEADERS=yes \
            COMPRESS_OUTPUTIMAGE=yes
          
          echo "=== Build Output ==="
          ls -lh output
          ls -lh output/images
          ls -lh output/debs

      - name: Upload binary to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            output/images/*.img.xz
            output/debs/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
